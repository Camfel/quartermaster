name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make all
      - name: govulncheck
        # Non-blocking: three containerd v1.7.x CRI checkpoint issues have no
        # 1.7.x fix and are unreachable from this client. Flip to blocking once
        # the remaining findings are triaged or containerd v2 is adopted.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
